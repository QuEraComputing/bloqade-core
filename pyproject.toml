[project]
name = "bloqade-core"
version = "0.7.0-dev"
description = "Core Components in Bloqade for neutral atom quantum computing."
readme = "README.md"
authors = [
    { name = "Phillip Weinberg", email = "pweinberg@quera.com" },
    { name = "Kai-Hsin Wu", email = "khwu@quera.com" }
]
dependencies = [
    "kirin-toolchain~=0.22.11",
    "loguru>=0.7.3",
    "qlam-core~=0.6.0",
]
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=24.10.0",
    "coverage>=7.6.4",
    "ipython>=8.29.0",
    "isort>=5.13.2",
    "mypy>=1.13.0",
    "numpy>=1.26.4",
    "pre-commit>=4.0.1",
    "pyright[nodejs]>=1.1.408",
    "pytest>=8.3.3",
    "ruff>=0.7.3",
    "rust-just>=1.36.0",
]

[dependency-groups]
doc = [
    "griffe-kirin>=0.1.0",
    "griffe-inherited-docstrings>=1.1.1",
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.5.44",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bloqade"]

[tool.isort]
profile = "black"
combine_as_imports = true
multi_line_output = 3
src_paths = ["src/bloqade"]

[tool.black]
line-length = 88

[tool.ruff]
# The package supports Python 3.10+, so do not suggest syntax introduced in
# Python 3.12 (PEP 695 type parameters).
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Import ordering is handled by the dedicated isort hook.
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
# These decorated interface functions are runtime stubs. Their ellipses are
# necessary for Pyright to treat them as non-returning implementations.
"src/bloqade/geometry/dialects/filled/_interface.py" = ["PIE790"]
"src/bloqade/geometry/dialects/grid/_interface.py" = ["PIE790"]

[tool.coverage.run]
include = ["src/bloqade/*"]

[tool.coverage.report]
exclude_also = [
    '@overload',
    '@_wraps'
]

[tool.pyright]
ignore = ["demo/qasm_single_task.py", "demo/qasm_single_task_persistent.py", "demo/qasm_single_task_simpler_serialization.py"]  # requires bloqade-circuit so pyright will always fail

[tool.pytest.ini_options]
testpaths = "test/"
